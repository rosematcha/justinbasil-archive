# Generated by scripts/gen-decap-config.mjs — edit that, then re-run.
# Local editing:  npx decap-server   (in another terminal) + open http://localhost:4321/admin/
# Production:      GitHub backend below (needs an OAuth provider) — see DEPLOY.md.
backend:
  name: github
  repo: rosematcha/justinbasil-archive
  branch: main
# Lets you edit local files in dev against `npx decap-server` instead of GitHub.
local_backend: true

media_folder: public/images
public_folder: /images

# The bodies are preserved raw HTML+Markdown; the body field below is a RAW textarea
# (modes: ['raw']) so nothing re-parses or mangles the HTML.
collections:
  - name: resources
    label: 'Resources (Site Updates)'
    folder: src/content/resources
    extension: md
    format: frontmatter
    create: true
    identifier_field: title
    sortable_fields:
      fields: [publishDate, title]
      default:
        field: publishDate
        direction: descending
    fields:
      - name: title
        label: 'Title'
        widget: string
        required: true
      - name: description
        label: 'Description'
        widget: text
        required: false
      - name: navTitle
        label: 'Nav title'
        widget: string
        required: false
      - name: ogImage
        label: 'OG image path'
        widget: string
        required: false
      - name: sourceUrl
        label: 'Original URL (provenance)'
        widget: string
        required: false
      - name: showHeading
        label: 'Show heading'
        widget: boolean
        required: false
        default: false
      - name: draft
        label: 'Draft'
        widget: boolean
        required: false
        default: false
      - name: order
        label: 'Sort order'
        widget: number
        required: false
        value_type: int
      - name: publishDate
        label: 'Publish date'
        widget: datetime
        required: false
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
      - name: category
        label: 'Category'
        widget: string
        required: false
      - name: excerpt
        label: 'Excerpt'
        widget: text
        required: false
      - name: body
        label: 'Body (raw)'
        widget: markdown
        modes: ['raw']
        buttons: []
        editor_components: []
